name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.2)'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Installer and Multi-platform Packages
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Run Automated Verification Tests
        run: dotnet run -- --test

      - name: Build Windows x64 (Self-Contained)
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64

      - name: Build Windows x86 (Self-Contained 32-bit)
        run: dotnet publish -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x86

      - name: Build Linux x64 (Self-Contained)
        run: dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/linux-x64

      - name: Clean Output Artifacts
        shell: powershell
        run: |
          # Защита данных: исключаем любые БД, бэкапы, экспорты и логи из всех каталогов publish
          Remove-Item -Path "publish\*\*.db", "publish\*\*.pdb", "publish\*\*.log" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "publish\*\Backups", "publish\*\Exports" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build Universal Windows Installer (Inno Setup)
        shell: powershell
        run: |
          $tag = "${{ inputs.tag_name || github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.0.2" }
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc -or -not (Test-Path $iscc)) {
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$version" installer.iss

      - name: Package Linux Distribution
        shell: powershell
        run: |
          tar -czf "publish\ShiftRoster-linux-x64.tar.gz" -C "publish\linux-x64" .
          Get-ChildItem publish

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "ShiftRoster ${{ inputs.tag_name || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            publish/installer/ShiftRoster-Setup.exe
            publish/ShiftRoster-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
